# AtmosTune Configuration
# Lightweight, run-and-kill background weather/time playlist auto-curator

weather_api:
  # OpenWeatherMap API Key. Can also be set via OPENWEATHER_API_KEY environment variable.
  # If empty, AtmosTune smoothly falls back to realistic environmental simulation.
  api_key: ""
  lat: 40.7128
  lon: -74.0060
  city_name: "New York"
  units: "metric"  # "metric" (Celsius) or "imperial" (Fahrenheit)
  timeout_seconds: 5
  mock_fallback: true

scheduling:
  # Minimum minutes required between automated updates, unless weather/time block changes
  cooldown_minutes: 60
  # Minimum temperature variation in degrees to warrant an early update
  min_temperature_delta: 4.0
  # Time block definitions (24-hour clock, [start_inclusive, end_exclusive])
  time_blocks:
    early_morning:
      start: 5
      end: 8
    morning:
      start: 8
      end: 12
    afternoon:
      start: 12
      end: 17
    evening:
      start: 17
      end: 21
    night:
      start: 21
      end: 5

playlist:
  # Target Spotify playlist URL to be rewritten
  # Example: "https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M"
  target_playlist_url: "https://open.spotify.com/playlist/YOUR_PLAYLIST_ID_HERE"
  playlist_name_prefix: "AtmosTune • "
  max_tracks: 10
  # Energy curve type: "bell_curve" (gentle start -> peak -> warm down), "steady", or "ascending"
  curve_type: "bell_curve"
  curve_sigma: 0.18

browser:
  # Persistent profile path preserving authentication cookies across run-and-kill cycles
  profile_dir: "./browser_profile"
  headless: true
  page_timeout_sec: 30
  action_timeout_sec: 8
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

notifications:
  enabled: true
  app_name: "AtmosTune"
  timeout_sec: 6
  log_file: "./logs/atmostune.log"
  log_level: "INFO"
  max_log_bytes: 2097152  # 2MB
  backup_count: 3

